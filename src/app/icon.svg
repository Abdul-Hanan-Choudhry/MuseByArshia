<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark ink background -->
  <rect width="32" height="32" fill="#1A1714"/>
  <!-- Stylised italic M in cream -->
  <text x="16" y="24"
        font-family="Georgia,'Times New Roman',serif"
        font-style="italic"
        font-size="26"
        fill="#F5F0E8"
